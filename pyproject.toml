[project]
name = "thermoguard-ai"
version = "1.0.0"
description = "ThermoGuard AI - Smart Industrial Environmental Monitoring & AI Anomaly Detection"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "requests>=2.31.0",
    "gunicorn>=21.2.0",
]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E402", "F401", "F841"]
